spring:
  main:
    allow-circular-references: false
  application:
    name: spiceflow-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB
  datasource:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 30000
    p6spy:
      enable-logging: true
      tracing:
        include-parameter-values: true
      logging: "slf4j"
      outagedetection: true
      outagedetectioninterval: 1
  jpa:
    properties:
      hibernate:
        generate_statistics: true

server:
  forward-headers-strategy: FRAMEWORK
  port: 8080
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0 # Development setting, update for prod if using an exporter
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true

logging:
  level:
    root: INFO
    com.spiceflow: DEBUG

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 28800000
    refresh-token-expiry: 604800000

security:
  rate-limit:
    ip:
      capacity: 30
      refill: 30
      duration: 60
    account:
      max-failed-attempts: 5
      lockout-duration-minutes: 15
