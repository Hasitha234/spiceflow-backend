spring:
  datasource:
    url: jdbc:h2:file:./data/spiceflow_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: password
    driver-class-name: org.h2.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 10
      idle-timeout: 300000
      max-lifetime: 900000
      connection-timeout: 30000
      validation-timeout: 5000
      keepalive-time: 120000
      leak-detection-threshold: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        generate_statistics: true
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
      javax:
        persistence:
          query:
            timeout: 5000
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-on-validation-error: true
    clean-disabled: false
    locations: classpath:db/migration

logging:
  file:
    name: backend.log
  level:
    com.spiceflow: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
    org.hibernate.stat: DEBUG

app:
  cors:
    allowed-origins: http://localhost:8080,http://127.0.0.1:8080,http://localhost:3000,http://127.0.0.1:3000,http://localhost:4200,http://localhost:5173,http://127.0.0.1:5173
  jwt:
    secret: localDevSecretKeyMustBeAtLeast256BitsLongForHmacSha256Algorithm!
    access-token-expiry: 28800000
    refresh-token-expiry: 604800000
