spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: ${DB_MIN_IDLE:5}
      maximum-pool-size: ${DB_POOL_SIZE:20}
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      validation-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        generate_statistics: false
        default_batch_fetch_size: 50
        jdbc:
          batch_size: 50
      javax:
        persistence:
          query:
            timeout: 5000
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.spiceflow: INFO

# P0 Security: Hide health details from unauthenticated users in production
management:
  endpoint:
    health:
      show-details: when_authorized

# Swagger UI enabled for frontend developer collaboration
# API endpoints are already protected by JWT authentication
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true