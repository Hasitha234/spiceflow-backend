spring:
  application:
    name: spiceflow-backend
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true


logging:
  level:
    root: INFO
    com.spiceflow: DEBUG

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiry: 28800000
    refresh-token-expiry: 604800000

security:
  rate-limit:
    ip:
      capacity: 30
      refill: 30
      duration: 60
    account:
      max-failed-attempts: 5
      lockout-duration-minutes: 15
